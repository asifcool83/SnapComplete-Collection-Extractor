name: Refresh SnapComplete collection

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Refresh SnapComplete collection')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install temporary browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract and validate collection
        run: node refresh_collection.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- collection.json; then
            echo "Collection unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.json
          git commit -m "Refresh SnapComplete collection"
          git push
